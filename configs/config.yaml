server:
  port: 8080
  mode: "debug" # debug | release | test
  read_timeout: 10s
  write_timeout: 10s

logger:
  level: "info" # debug | info | warn | error
  filename: "logs/app.log"
  max_size: 100 # MB
  max_backups: 10
  max_age: 30 # days
  compress: true
  enable_console: true

database:
  driver: "postgres"
  # Locally overridden by CLOUD_DATABASE_DSN from .local/dev.env (`task setup`).
  dsn: "host=127.0.0.1 port=55432 user=postgres dbname=ora_test sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
collaboration:
  # Development-only: installs the in-memory Agent/Team/Workflow fixtures (internal/collab) onto the
  # Store's collaboration ports, so the @ target discovery API serves agent/team/workflow targets in
  # addition to humans. Explicitly enabled; production default OFF. Independent of authentication —
  # enabling GitHub Auth never enables these fixtures. Override: CLOUD_COLLABORATION_DEVELOPMENT_FIXTURES=true.
  development_fixtures: false
control:
  grpc_addr: "127.0.0.1:8082" # Controller-facing gRPC, unauthenticated at this stage; loopback or private network only
# Object Storage for Skill packages (production S3-compatible provider). Optional: when this whole
# section is absent (as here), the process starts normally and Skill uploads are unavailable
# (object_store_unavailable). Uncomment and fill in to enable real object storage; an invalid section
# fails startup. Every key below is also overridable via CLOUD_STORAGE_* (e.g. CLOUD_STORAGE_BUCKET).
#storage:
#  provider: s3              # fixed "s3"
#  bucket: ora-skills        # single bucket; the name never enters durable state
#  region: us-east-1         # protocol-required region placeholder for the endpoint
#  endpoint: ""              # optional; empty = AWS default endpoint, non-empty = self-hosted endpoint
#  path_style: false         # true = path-style addressing (self-hosted/OSS usually need it)
#  credential_mode: environment  # environment | shared_credentials_file | workload_identity
#  credentials_file: ""      # required when credential_mode=shared_credentials_file
#  tls:
#    verify: true            # default true (HTTPS + certificate verification)
#    ca_file: ""             # optional custom CA bundle
#  allow_insecure_http: false # default false; only explicit dev/test may use an http:// endpoint
#  timeouts:
#    connect: 5s             # connection establishment
#    request: 30s            # per-operation end-to-end bound
auth:
  audience: "ora-cloud"
  # Public keys of the local Gateway; generate them with `task setup` (config.toml). Production replaces
  # these entries with the deployment's keys; see docs/authentication.md.
  keys:
    - id: gateway-service-2026
      issuer: ora-internal-issuer
      kind: service
      role: gateway
      public_key_file: .local/gateway/gateway-service.pem
    - id: user-identity-2026
      issuer: ora-internal-issuer
      kind: user
      public_key_file: .local/gateway/user-identity.pem
